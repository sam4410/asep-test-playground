services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: asep
      POSTGRES_USER: asep
      POSTGRES_PASSWORD: asep
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asep -d asep"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
