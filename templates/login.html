<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Log In</title>
<style>
  body{font-family:sans-serif;max-width:400px;margin:60px auto;padding:0 16px}
  h1{margin-bottom:24px}
  input{display:block;width:100%;padding:8px;margin:8px 0 16px;box-sizing:border-box;border:1px solid #ccc;border-radius:4px}
  button{width:100%;padding:10px;background:#1a73e8;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:15px}
  button:hover{background:#1558b0}
  .flash{background:#fff3cd;padding:8px 12px;border-radius:4px;margin-bottom:16px}
  a{color:#1a73e8}
</style>
</head>
<body>
  <h1>Log In</h1>
  {% with messages = get_flashed_messages() %}
    {% if messages %}<div class="flash">{{ messages[-1] }}</div>{% endif %}
  {% endwith %}
  <form method="POST">
    <label>Username</label>
    <input type="text" name="username" required>
    <label>Password</label>
    <input type="password" name="password" required>
    <button type="submit">Log in</button>
  </form>
  <p style="margin-top:16px">No account? <a href="/signup">Sign up</a></p>
</body>
</html>
