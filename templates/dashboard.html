<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard · Pocketwise</title>
  <style>
    :root { --ink:#172033; --muted:#68738a; --primary:#6558f5; --green:#159b72; --red:#d85868; --bg:#f5f6fc; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--bg); font:16px/1.5 Inter,ui-sans-serif,system-ui,sans-serif; }
    header { display:flex; align-items:center; justify-content:space-between; padding:22px max(24px,calc((100% - 1120px)/2)); background:#fff; }
    .brand { color:var(--primary); font-weight:800; letter-spacing:-.04em; font-size:1.35rem; }
    header button { border:0; color:var(--muted); background:none; font:600 .9rem inherit; cursor:pointer; }
    main { width:min(1120px,calc(100% - 48px)); margin:42px auto; }
    h1 { margin:0 0 7px; font-size:2.25rem; letter-spacing:-.05em; }
    .sub { margin:0 0 30px; color:var(--muted); }
    .cards { display:grid; grid-template-columns:repeat(3,1fr); gap:18px; }
    .card, .panel { padding:24px; border-radius:18px; background:#fff; box-shadow:0 8px 30px #28305d0a; }
    .label { color:var(--muted); font-size:.85rem; font-weight:700; }
    .value { margin-top:8px; font-size:1.8rem; font-weight:800; letter-spacing:-.04em; }
    .layout { display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-top:18px; }
    .panel h2 { margin:0 0 20px; font-size:1.1rem; }
    .category { display:flex; justify-content:space-between; padding:11px 0; border-bottom:1px solid #edf0f6; }
    .transaction { display:flex; justify-content:space-between; padding:13px 0; border-bottom:1px solid #edf0f6; }
    .meta { color:var(--muted); font-size:.85rem; }
    .income { color:var(--green); font-weight:800; } .expense { color:var(--red); font-weight:800; }
    .empty { color:var(--muted); }
    @media (max-width:700px) { .cards,.layout { grid-template-columns:1fr; } main { margin-top:28px; } }
  </style>
</head>
<body>
  <header><div class="brand">✦ Pocketwise</div><button id="logout">Sign out</button></header>
  <main>
    <h1>Your money at a glance</h1>
    <p class="sub">Here’s how things are looking this month.</p>
    <section class="cards">
      <div class="card"><div class="label">Total balance</div><div class="value" id="balance">—</div></div>
      <div class="card"><div class="label">Monthly income</div><div class="value income" id="income">—</div></div>
      <div class="card"><div class="label">Monthly spending</div><div class="value expense" id="spending">—</div></div>
    </section>
    <section class="layout">
      <div class="panel"><h2>Spending by category</h2><div id="categories" class="empty">Loading…</div></div>
      <div class="panel"><h2>Recent transactions</h2><div id="transactions" class="empty">Loading…</div></div>
    </section>
  </main>
  <script>
    const token = localStorage.getItem("finance_token");
    if (!token) window.location.href = "/login";
    const money = value => `$${Number(value).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2})}`;
    async function loadDashboard() {
      const response = await fetch("/api/dashboard/summary", {headers: {Authorization: `Bearer ${token}`}});
      if (response.status === 401) { localStorage.removeItem("finance_token"); window.location.href = "/login"; return; }
      if (!response.ok) throw new Error("Unable to load dashboard.");
      const data = await response.json();
      document.querySelector("#balance").textContent = money(data.total_balance);
      document.querySelector("#income").textContent = money(data.monthly_income);
      document.querySelector("#spending").textContent = money(data.monthly_spending);
      const categories = document.querySelector("#categories");
      categories.className = data.category_spending.length ? "" : "empty";
      categories.innerHTML = data.category_spending.length
        ? data.category_spending.map(item => `<div class="category"><span>${item.category}</span><strong>${money(item.amount)}</strong></div>`).join("")
        : "No spending recorded this month.";
      const transactions = document.querySelector("#transactions");
      transactions.className = data.recent_transactions.length ? "" : "empty";
      transactions.innerHTML = data.recent_transactions.length
        ? data.recent_transactions.map(item => `<div class="transaction"><span><strong>${item.category}</strong><br><span class="meta">${item.date}</span></span><span class="${item.type}">${item.type === "income" ? "+" : "−"}${money(item.amount)}</span></div>`).join("")
        : "No transactions yet.";
    }
    document.querySelector("#logout").addEventListener("click", async () => {
      await fetch("/api/auth/logout", {method:"POST", headers:{Authorization:`Bearer ${token}`}});
      localStorage.removeItem("finance_token"); window.location.href = "/login";
    });
    loadDashboard().catch(() => { document.querySelector("main").insertAdjacentHTML("beforeend", "<p class='empty'>Could not load your dashboard.</p>"); });
  </script>
</body>
</html>
