<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex items-center justify-center">
  <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-8 w-full max-w-sm">
    <h1 class="text-2xl font-bold text-gray-900 mb-6">Create Account</h1>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="bg-yellow-50 border-l-4 border-yellow-400 px-4 py-3 mb-4 text-sm text-yellow-800">{{ messages[-1] }}</div>
      {% endif %}
    {% endwith %}
    <form method="POST" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
        <input type="text" name="username" required
               class="border border-gray-300 rounded-md px-3 py-2 w-full focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input type="password" name="password" required
               class="border border-gray-300 rounded-md px-3 py-2 w-full focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>
      <button type="submit"
              class="w-full bg-indigo-600 text-white font-medium px-4 py-2 rounded-md hover:bg-indigo-700 transition-colors">
        Create account
      </button>
    </form>
    <p class="mt-4 text-sm text-center text-gray-600">
      Already have an account? <a href="/login" class="text-indigo-600 hover:underline">Log in</a>
    </p>
  </div>
</body>
</html>
