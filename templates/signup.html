<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account · Pocketwise</title>
  <style>
    :root { --ink:#172033; --muted:#68738a; --primary:#6558f5; --surface:#fff; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; color:var(--ink); background:linear-gradient(135deg,#eef0ff,#fff7e8); font:16px/1.5 Inter,ui-sans-serif,system-ui,sans-serif; }
    .card { width:min(430px,100%); padding:42px; background:var(--surface); border-radius:24px; box-shadow:0 20px 55px #3d34751c; }
    .brand { color:var(--primary); font-weight:800; letter-spacing:-.04em; font-size:1.35rem; }
    h1 { margin:28px 0 8px; font-size:2rem; letter-spacing:-.04em; }
    .intro { margin:0 0 28px; color:var(--muted); }
    label { display:block; margin:17px 0 7px; font-weight:700; font-size:.9rem; }
    input { width:100%; border:1px solid #dce1ef; border-radius:11px; padding:13px 14px; color:var(--ink); font:inherit; outline:none; }
    input:focus { border-color:var(--primary); box-shadow:0 0 0 4px #6558f51c; }
    button { width:100%; margin-top:25px; border:0; border-radius:11px; padding:14px; color:#fff; background:var(--primary); font:700 1rem inherit; cursor:pointer; }
    .hint { margin:7px 0 0; color:var(--muted); font-size:.8rem; }
    .error { min-height:24px; margin-top:15px; color:#c43d50; font-size:.9rem; }
    .switch { margin:24px 0 0; text-align:center; color:var(--muted); font-size:.92rem; }
    a { color:var(--primary); font-weight:700; text-decoration:none; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">✦ Pocketwise</div>
    <h1>Start feeling in control</h1>
    <p class="intro">Create your account and make every dollar count.</p>
    <form id="signup-form">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required>
      <p class="hint">Use at least 8 characters.</p>
      <button type="submit">Create account</button>
      <div class="error" id="error" role="alert"></div>
    </form>
    <p class="switch">Already have an account? <a href="/login">Sign in</a></p>
  </main>
  <script>
    const form = document.querySelector("#signup-form");
    const error = document.querySelector("#error");
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      error.textContent = "";
      const body = Object.fromEntries(new FormData(form));
      try {
        const response = await fetch("/api/auth/signup", {
          method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Unable to create account.");
        localStorage.setItem("finance_token", data.token);
        window.location.href = "/dashboard";
      } catch (err) { error.textContent = err.message; }
    });
  </script>
</body>
</html>
